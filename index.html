<!DOCTYPE html>

<html>
  <head>
    <title>A 3D Cube</title>
    <meta charset="utf-8">
    <link rel="stylesheet" type="text/css" href="assets/css/style.css" />
    <script type="text/javascript" src="assets/js/main.js"></script>
    <!--
      Código exclusivo para Gabrielly
      Este é um presente pouco comum para uma amiga.
      Nenhuma outra pessoa vai receber algo parecido,
    -->
  </head>
  <body>
    <div class="container">
      <div class="cube">

        <div class="face face--front">
          <p class="main-text">Clique para Iniciar</p>
          <p class="sub-text"></p>
        </div>

        <div class="face face--right">
          <p class="main-text"></p>
          <p class="sub-text"></p>
        </div>

        <div class="face face--back">
          <p class="main-text"></p>
          <p class="sub-text"></p>
        </div>

        <div class="face face--left">
          <p class="main-text"></p>
          <p class="sub-text"></p>
        </div>

        <div class="face face--top">
          <p class="main-text"></p>
          <p class="sub-text"></p>
        </div>

        <div class="face face--bottom">
          <p class="main-text"></p>
          <p class="sub-text"></p>
        </div>
      </div>
    </div>
  </body>
</html>
